# MaxKB FDE 后端 API · 生产环境 Docker Compose
# 用法：cp .env.example .env 改密码，然后 docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: maxkb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?必须在 .env 设置 PGPASSWORD！}
      POSTGRES_DB: ${PGDATABASE:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机访问，避免公网暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maxkb-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxkb-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGPASSWORD: ${PGPASSWORD:?必须在 .env 设置 PGPASSWORD！}
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 设置 JWT_SECRET！}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://maxkb-edu.com,https://taoj2025.github.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-2949465671@qq.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?必须在 .env 设置！}
    ports:
      - "127.0.0.1:3001:3001"   # 仅本机监听，由 Nginx 反代
    volumes:
      - ../downloads:/app/public-downloads:ro   # 资源只读挂载
    networks:
      - maxkb-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
    name: maxkb-postgres-data

networks:
  maxkb-net:
    name: maxkb-net
    driver: bridge