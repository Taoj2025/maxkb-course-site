# MaxKB FDE 后端 API · Nginx 反代配置
# 安装路径：/etc/nginx/sites-available/maxkb-api
# 启用：    sudo ln -s /etc/nginx/sites-available/maxkb-api /etc/nginx/sites-enabled/
#
# 流量链路：
#   公网 https://taotaoedu.ltd/api/* ──► 本机 127.0.0.1:3001/api/*
#
# ⚠️ 本配置依赖后端只监听 127.0.0.1:3001
#    当前生产部署方式是 systemd（backend/systemd/maxkb-api.service），
#    由 backend/.env 里的 HOST=127.0.0.1 控制；
#    若改用 Docker Compose，docker-compose.yml 已把端口绑到 127.0.0.1:3001，不要改成 0.0.0.0。
#
# ⚠️ 服务器上 /etc/nginx/sites-available/taotaoedu 是同 server_name 的重复配置，
#    nginx 只用第一个加载的（按字母序 maxkb-api 优先），改配置请改本文件。

# ============ HTTP · 仅做 HTTPS 跳转 ============
server {
  listen 80;
  listen [::]:80;
  server_name taotaoedu.ltd www.taotaoedu.ltd;

    root /var/www/maxkb-course-site;
    index index.html;

  # Let's Encrypt 校验用 · 必须保留
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # 其他全部 301 跳 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ============ HTTPS · 主配置 ============
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name taotaoedu.ltd www.taotaoedu.ltd;

    root /var/www/maxkb-course-site;
    index index.html;

  # ===== SSL 证书（certbot 自动管理 · /opt/certbot/bin/certbot）=====
  ssl_certificate     /etc/letsencrypt/live/taotaoedu.ltd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taotaoedu.ltd/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/taotaoedu.ltd/chain.pem;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ===== 安全响应头 =====
  add_header X-Frame-Options          "SAMEORIGIN" always;
  add_header X-Content-Type-Options   "nosniff"    always;
  add_header X-XSS-Protection         "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # ===== 反代 /api/* → 后端 =====
  location /api/ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # 透传真实 IP / 协议
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 流式响应 · 大文件下载必须关 buffering
    proxy_buffering        off;
    proxy_request_buffering off;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # 临时文件 / 超时
    proxy_connect_timeout 10s;
    client_max_body_size  20m;   # 联系表单附件上限
  }

  # ===== 健康检查可走 HTTP · 用于部署脚本验证 =====
  location = /api/health {
    proxy_pass http://127.0.0.1:3001/api/health;
    access_log off;   # 关闭健康检查日志噪音
  }

  # ===== 隐藏敏感路径（安全加固）=====
  # 后端源码 / node_modules / .env 一律不允许公网下载
  # （后端已移出 web root 到 /opt/maxkb-api，这里是第二道防线）
  location ^~ /backend/ {
    return 404;
  }

  # 隐藏所有点开头的隐藏路径（.git / .github / .env 等）
  # 放行 .well-known 以保证 Let's Encrypt 续期校验
  location ~ /\.(?!well-known) {
    return 404;
  }

  # ===== 静态资源缓存 =====
  # 如未来要在 Nginx 直接托管 frontend/dist，可加：
  # location / {
  #   root /opt/maxkb-frontend;
  #   try_files $uri $uri/ /index.html;
  # }
}
