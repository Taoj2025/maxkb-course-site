# MaxKB FDE 后端 API · Nginx 反代配置
# 安装路径：/etc/nginx/sites-available/maxkb-api.conf
# 启用：    sudo ln -s /etc/nginx/sites-available/maxkb-api.conf /etc/nginx/sites-enabled/
#
# 流量链路：
#   公网 https://maxkb-edu.com/api/* ──► 本机 127.0.0.1:3001/api/*
#
# ⚠️ 本配置依赖 Docker Compose 把 API 容器端口绑到 127.0.0.1:3001
#    （docker-compose.yml 已写好，不要改成 0.0.0.0）

# ============ HTTP · 仅做 HTTPS 跳转 ============
server {
  listen 80;
  listen [::]:80;
  server_name maxkb-edu.com www.maxkb-edu.com;

  # Let's Encrypt 校验用 · 必须保留
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # 其他全部 301 跳 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ============ HTTPS · 主配置 ============
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maxkb-edu.com www.maxkb-edu.com;

  # ===== SSL 证书（certbot 自动管理）=====
  ssl_certificate     /etc/letsencrypt/live/maxkb-edu.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxkb-edu.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/maxkb-edu.com/chain.pem;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ===== 安全响应头 =====
  add_header X-Frame-Options          "SAMEORIGIN" always;
  add_header X-Content-Type-Options   "nosniff"    always;
  add_header X-XSS-Protection         "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # ===== 反代 /api/* → 后端 =====
  location /api/ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # 透传真实 IP / 协议
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 流式响应 · 大文件下载必须关 buffering
    proxy_buffering        off;
    proxy_request_buffering off;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # 临时文件 / 超时
    proxy_connect_timeout 10s;
    client_max_body_size  20m;   # 联系表单附件上限
  }

  # ===== 健康检查可走 HTTP · 用于部署脚本验证 =====
  location = /api/health {
    proxy_pass http://127.0.0.1:3001/api/health;
    access_log off;   # 关闭健康检查日志噪音
  }

  # ===== 静态资源缓存 =====
  # 如未来要在 Nginx 直接托管 frontend/dist，可加：
  # location / {
  #   root /opt/maxkb-frontend;
  #   try_files $uri $uri/ /index.html;
  # }
}