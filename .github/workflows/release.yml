name: Release MaxKB Course Site

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 作业 1: 构建 + 部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 作业 2: 同步到远程服务器（Vercel + 自建服务器）
  sync-remote:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步到 Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 同步到 Vercel..."
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN --yes
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes
          echo "✅ Vercel 部署完成"

      - name: 同步到自建服务器（rsync over SSH）
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          echo "🚀 同步到远程服务器 $REMOTE_HOST..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            ./ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
          echo "✅ 远程服务器同步完成"

      - name: 清理 SSH 密钥
        if: env.SSH_PRIVATE_KEY != ''
        run: rm -f ~/.ssh/id_rsa

  # 作业 3: 创建 GitHub Release（仅在 tag 触发时）
  release:
    needs: [deploy, sync-remote]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'MaxKB Course Site ${{ github.ref_name }}'
          body: |
            ## 🚀 MaxKB 课程站 Release ${{ github.ref_name }}

            **部署时间**：${{ github.event.repository.updated_at }}
            **部署状态**：✅ GitHub Pages + 远程服务器
            **提交哈希**：`${{ github.sha }}`

            ### 📊 部署详情
            - GitHub Pages：https://taoj2025.github.io/maxkb-course-site/
            - 自定义域名：https://maxkb-edu.com
            - 远程服务器：${{ secrets.REMOTE_HOST }}

            ### 📋 变更日志
            详见 [CHANGELOG.md](./CHANGELOG.md)

            ---
            **作者**：小陶老师
            **自动部署**：GitHub Actions
          draft: false
          prerelease: false
          generate_release_notes: true

  # 作业 4: 部署后通知
  notify:
    needs: [deploy, sync-remote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 微信通知（Server酱）
        if: env.WECHAT_KEY != ''
        env:
          WECHAT_KEY: ${{ secrets.WECHAT_KEY }}
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            curl -s "https://sctapi.ftqq.com/$WECHAT_KEY.send?title=MaxKB部署成功&desp=版本:${{ github.ref_name }}%0A时间:${{ github.event.head_commit.timestamp }}%0A状态:✅"
            echo "✅ 微信通知已发送"
          fi