# 后端部署 · SSH 到独立服务器拉取最新代码
# 服务器 IP 硬编码（DNS 解析失败的临时方案）：
#   host: 119.91.234.159（用户确认）
# ⚠️ 必须在 GitHub Settings > Secrets 配置：
#   SSH_USER           SSH 用户名（如 deploy / ubuntu / root）
#   SSH_PRIVATE_KEY    SSH 私钥（id_rsa 内容，保密！）
# 端口：2222（用户最终选择）

name: Deploy to Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug · 检查密钥指纹（不打印私钥内容）
        run: |
          echo "SSH_USER: ${{ secrets.SSH_USER }}"
          KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          echo "SSH_PRIVATE_KEY 字节长度: ${#KEY}"
          echo "SSH_PRIVATE_KEY 行数: $(printf '%s\n' "$KEY" | wc -l)"
          # 把密钥写到临时文件算指纹，算完立刻删，绝不打印内容
          TMPKEY=$(mktemp)
          chmod 600 "$TMPKEY"
          printf '%s\n' "$KEY" > "$TMPKEY"
          if ssh-keygen -y -f "$TMPKEY" >/dev/null 2>&1; then
            echo "===== SSH_PRIVATE_KEY 公钥指纹（服务器应有对应授权） ====="
            ssh-keygen -lf "$TMPKEY"
            echo "===== 完整公钥（用于对比服务器 authorized_keys） ====="
            ssh-keygen -y -f "$TMPKEY"
          else
            echo "===== 私钥解析失败！可能不是合法 OpenSSH 私钥 ====="
          fi
          rm -f "$TMPKEY"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 验证 SSH 连通性
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.91.234.159
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 2m
          script: |
            echo "===== SSH 连接成功 $(date) ====="
            echo "用户: $(whoami)"
            echo "路径: $(pwd)"
            echo "磁盘: $(df -h /var/www 2>&1 | tail -2 || echo 'N/A')"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.91.234.159
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 10m
          script: |
            set -e
            echo "===== 部署开始 $(date) ====="
            echo "===== 拉取最新代码 ====="
            cd /var/www/maxkb-course-site
            sudo -u www-data git pull origin main
            echo "===== 部署完成 ====="