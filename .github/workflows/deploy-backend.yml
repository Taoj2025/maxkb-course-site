# 后端部署 · 仅在 backend/ 变更时触发 · SSH 到独立服务器跑 Docker Compose
# ⚠️ 必须在 GitHub Settings > Secrets 配置：
#   SSH_HOST           服务器 IP 或域名
#   SSH_USER           SSH 用户名（如 deploy / ubuntu）
#   SSH_PRIVATE_KEY    SSH 私钥（id_rsa 内容，保密！）

name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:    # 允许手动触发

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH (Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/maxkb-api/deploy.sh
          command_timeout: 10m