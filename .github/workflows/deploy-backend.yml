# 后端部署 · SSH 到独立服务器拉取最新代码并重启服务
# 服务器：119.91.234.159（DNS 解析到该 IP 的独立服务器，非 GitHub Pages）
# 端口：2222
#
# ⚠️ 必须在 GitHub Settings > Secrets 配置：
#   SSH_USER           SSH 用户名（如 root / deploy / ubuntu）
#   SSH_PRIVATE_KEY    SSH 私钥（id_rsa 内容，保密！）
#
# 服务器上 ~/.ssh/authorized_keys 权限 600，~/.ssh 权限 700（2026-09-12 修复）
# PermitRootLogin 已改为 prohibit-password（2026-09-12 修复）
#
# 部署链路（实际生效的部分在 backend/scripts/prod-deploy.sh 里）：
#   git pull → rsync backend/ → /opt/maxkb-api/backend → npm ci → 数据库迁移
#   → systemctl restart maxkb-api → 健康检查
#
# 注意：应用代码部署在 /opt/maxkb-api（nginx web root 之外），
#      避免 backend/.env 与源码被公网直接下载。

name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug · 检查密钥指纹（不打印私钥内容）
        run: |
          echo "===== Debug step 开始 ====="
          echo "SSH_USER: ${{ secrets.SSH_USER }}"
          KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          echo "SSH_PRIVATE_KEY 字节长度: ${#KEY}"
          TMPKEY=$(mktemp)
          chmod 600 "$TMPKEY"
          printf '%s\n' "$KEY" > "$TMPKEY"
          {
            echo "===== SSH_PRIVATE_KEY 公钥指纹 ====="
            if ssh-keygen -y -f "$TMPKEY" >/dev/null 2>&1; then
              ssh-keygen -lf "$TMPKEY"
              echo "===== 完整公钥（用于对比服务器 authorized_keys） ====="
              ssh-keygen -y -f "$TMPKEY"
            else
              echo "===== 私钥解析失败！可能不是合法 OpenSSH 私钥 ====="
            fi
            echo "===== END ====="
          }
          rm -f "$TMPKEY"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 验证 SSH 连通性
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.91.234.159
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 2m
          script: |
            echo "===== SSH 连接成功 $(date) ====="
            echo "用户: $(whoami)"
            echo "磁盘: $(df -h / | tail -1)"
            echo "服务: $(systemctl is-active maxkb-api 2>/dev/null || echo '未安装')"

      - name: 部署（同步代码 · 装依赖 · 迁移 · 重启 · 健康检查）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.91.234.159
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 10m
          script: |
            set -e
            echo "===== 部署开始 $(date) ====="
            cd /var/www/maxkb-course-site
            git config --global --add safe.directory /var/www/maxkb-course-site
            bash backend/scripts/prod-deploy.sh
            echo "===== 部署完成 $(date) ====="
